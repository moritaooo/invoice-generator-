
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>請求書</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .title { font-size: 24px; font-weight: bold; margin-bottom: 20px; }
        .section { margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #999; padding: 8px; text-align: left; }
        th { background-color: #f0f0f0; }
    </style>
</head>
<body>
    <div class="title">請求書</div>
    <div class="section">
        <strong>宛先：</strong> {{ company }}<br>
        <strong>担当者：</strong> {{ person }} 様
    </div>
    <div class="section">
        <strong>請求内容</strong>
        <table>
            <tr>
                <th>項目</th>
                <th>単価</th>
                <th>数量</th>
                <th>金額</th>
            </tr>
            <tr>
                <td>{{ item }}</td>
                <td>{{ unit_price }} 円</td>
                <td>{{ quantity }}</td>
                <td>{{ total_price }} 円</td>
            </tr>
        </table>
    </div>
</body>
</html>
